<div class="oj-hybrid-padding">
    <h2>OJET components</h2>
    <div id="sampleDemo" class="demo-padding demo-container">
      <oj-c-input-text
              on-input="[[buttonAction]]"
              id="text-input"
              value="{{firstname}}"
              label-hint="Enter name"
              label-edge="inside"></oj-c-input-text>  
      <oj-c-input-password on-input="[[buttonAction]]" value="{{password}}" label-hint="Enter password"></oj-c-input-password>
      
      
      <oj-c-button id="button2" on-oj-action="[[navigateToSuccess]]" label="Login"></oj-c-button>
    </div>
</div>
