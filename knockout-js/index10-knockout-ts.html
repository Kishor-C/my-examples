<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>
        <span data-bind="text: username"></span>
        <span data-bind="text:phone"></span>
    </h2>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.0/knockout-min.js" type="text/javascript"></script>
     <script src="https://cdnjs.cloudflare.com/ajax/libs/typescript/5.9.2/typescript.min.js" integrity="sha512-Yh26Qh+//HJj0WRDGnqgwbzxKBlWSVyv5uxWHHftGIHcL6iFUkqozesL4UreGkI1+5UcvRZmEE1iw/IN2cL2Rw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/text-typescript@1.3.0"></script>
 
    <script type="text/typescript">
        class AppViewModel {
            username : ko.Observable<string>;
            phone  ko.Observable<number>;
            constructor() {
                this.username = ko.observable("Kishor");
                this.phone = ko.observable(9239393);
            }
        }
        ko.applyBindings(new AppViewModel());
    </script>
</body>
</html>
