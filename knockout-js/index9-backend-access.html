<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
         <button data-bind="click: fetchUsers">Fetch Users</button>
         <div data-bind="foreach: users">
           <h3>
            <span data-bind="text:name"></span> Summary!
           </h3>
            <div>Id: <span data-bind="text:id"></span></div>
            <div data-bind="with: address">
                <h4>Address:</h4>
                <div>
                    Street: <span data-bind="text: street"></span>,
                    City: <span data-bind="text: city"></span>
                </div>
            </div>
            <hr />
         </div>
         
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/knockout/3.5.0/knockout-min.js" type="text/javascript"></script>
    <script type="text/javascript">
        function AppViewModel() {
           this.users = ko.observableArray();
           this.fetchUsers = async (event) => {
             let partialResponse = await fetch('https://jsonplaceholder.typicode.com/users');
             let jsonContent = await partialResponse.json();
             this.users(jsonContent);
           }
        }
        ko.applyBindings(new AppViewModel());
    </script>
</body>
</html>
