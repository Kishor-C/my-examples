<!DOCTYPE html>

<body>
    <div id = "b1">
        
    </div>
    <script type="text/javascript">
        let promise1 = new Promise((resolve, reject)=>{
            setTimeout(()=>{
                resolve('resolved')
            }, 500)
        });
        let promise2= new Promise((resolve, reject)=>{
            setTimeout(()=>{
                reject('rejected')
            }, 100)
        });
        let p = Promise.any([promise1, promise2])
        
        p.then(v => console.log('then: ',v)).catch(e=>console.log('catch: ', e));
    </script>
</body>
